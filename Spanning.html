<!-- Create a 4×4 explicit grid and place eight items manually using grid-column-start/end and
grid-row-start/end
207. Use the shorthand: grid-column: 1 / 3 and grid-row: 2 / 4 on separate items
208. Use the span keyword: grid-column: span 2 on three items spanning different numbers
209. Use negative line numbers: grid-column: 1 / -1 to make an item span the full row
210. Demonstrate dense packing: grid-auto-flow: dense - show how it fills gaps compared to the
default -->

<!DOCTYPE html>
<html lang="en-US">
    <head >
     <title>About Page</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width intial-scaling=1.0">
        <meta name="description" content="This is a home page">
        <style>
            .container-1{
                display: grid;
                grid-template-columns: 1fr 1fr 1fr 1fr;

            }

            container-2{
                display: grid;
                grid-template-columns: 1fr 1fr 1fr 1fr;
                grid-template-rows: 1fr 1fr 1fr 1fr;
                grid-auto-flow: dense;
                background-color: beige;
            }
            .container-2 div{
                border:solid black;
                height: 100px;
                width: 150px;
                
            }

            .container-1 div{
                border:solid black;
                height: 100px;
                
            }
