173. Show flex-shrink: create a row where total item widths exceed the container. Set different shrink

<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width initial-scaling=1.0">
        <title>Flexbox.html</title>
        <style>
            .container{
                display: flex;
                border: solid #6176b3;
                height: 30vh;
                width: 70vw;
                flex-direction: row;
               
                
            }

            .container1{
                display: flex;
                border: solid #6176b3;
                height: 30vh;
                width: 70vw;
                flex-direction: row;
               
                
            }

            .container1 div{
                height: 10vh;
                width: 15vw;
                font-size: 25px;
                border: solid rgb(0, 0, 0);
               
            }

            .container div:nth-of-type(1){
                flex-grow: 0;
                height: 10vh;
                font-size: 25px;
                border: solid rgb(0, 0, 0);
                
                
            }
            .container div:nth-of-type(2){
                flex-grow: 1;
                height: 10vh;
                
                font-size: 25px;
                border: solid rgb(0, 0, 0);
                
            }
            .container div:nth-of-type(3){
                flex-grow: 2;
                height: 10vh;
                font-size: 25px;
                border: solid rgb(0, 0, 0);
                
            }
            .container div:nth-of-type(4){
                flex-grow: 1;
                height: 10vh;
                font-size: 25px;
                border: solid rgb(0, 0, 0);
                
            }
            .container div:nth-of-type(5){
                flex-grow: 0;
                height: 10vh;
                font-size: 25px;
                border: solid rgb(0, 0, 0);
                
            }
        </style>
    </head>

    <body>
        
        <main>
            <h2>justify-content:Start</h2>
            <div class="container">
                <div>1st contianer</div>
                <div style="align-self:center;">2nd contianer</div>
                <div>3rd contianer</div>
                <div>4th container</div>
                <div>5th container</div>
            </div>

            <h2>
                this is shrink exp
            </h2>
            <div class="container1">
                <div>1</div>
                <div style="flex-shrink: 10;">2</div>
                <div>3</div>
                <div>4</div>
                <div>5</div>
                <div style="flex-shrink: 4;">6</div>
                <div>7</div>
                <div>8</div>
            </div>
            
            <h2>flex-basis demonstration</h2>
            <div class="container1">
                
                <div style="flex-basis: 0;">1</div>
                <div style="flex-basis: auto;">2</div>
                <div style="flex-basis: 300px;">3</div>
                <div style="flex-basis: 33.33%;">4</div>
                <div style="flex-basis: 50px;">5</div>
                <div style="flex-basis: 30px;">6</div>
                <div style="flex-basis: 30px;">7</div>
                <div style="flex-basis: 30px;">8</div>
            </div>

            <h2>justify-content:Start</h2>
            <div class="container">
                <div style="order: 5;">1st contianer</div>
                <div style="order: 1";>2nd contianer</div>
                <div style="order: 3";>3rd contianer</div>
                <div style="order: 2";>4th container</div>
                <div style="order: 4";>5th container</div>
            </div>




        </main>
