<!-- Three-column Kanban (To Do, In Progress, Done) using HTML5 Drag and Drop API
387. dragstart: store card id in dataTransfer. dragover: preventDefault. dragenter: show drop target.
drop: move card.
388. Add/delete cards via per-column form. Persist state to localStorage.
389. Keyboard: Space to pick up, arrow keys to move between columns, Space to drop
let selectedTask = "";
let currentColumn = 0; -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drag and Drop Kanban Board</title>
    <style>
      * {
        box-sizing: border-box;
      }
      .board {
        display: flex;
        width: 100%;
        gap: 5px;
      }
      .container {
        width: 30%;
        height: 90vh;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border: solid black;
        padding: 5px;
      }
      .column {
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        min-height: 70vh;
        gap: 5px;
        padding: 4px;
        background-color: bisque;
      }
      .column h2 {
        text-align: center;
      }
      .column.drag {
        background-color: rgb(207, 117, 15);
      }
      .column span {
        display: flex;
      }
      .column span button {
        margin-left: auto;
      }
      .create {
        margin-top: auto;
        align-self: flex-end;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="board">
        <div class="container">
          <div class="column todo">
            <h2>To do</h2>
          </div>
          <div class="create">
            <label for="task">Task:</label>
            <input type="text" id="task" />
            <button>Add</button>
          </div>
        </div>
        <div class="container">
          <div class="column progress">
            <h2>In progress</h2>
          </div>
          <div class="create">
            <label for="task">Task:</label>
            <input type="text" id="task" />
            <button>Add</button>
          </div>
        </div>
        <div class="container">
          <div class="column done">
            <h2>Done</h2>
          </div>
          <div class="create">
            <label for="task">Task:</label>
            <input type="text" id="task" />
            <button>Add</button>
          </div>
        </div>
      </div>
      <script src="task7.js"></script>
    </main>
  </body>
</html>
