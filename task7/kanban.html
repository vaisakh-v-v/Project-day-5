​Use it to persist the Kanban board in IndexedDB instead of localStorage​
​Add a sync mechanism: when online event fires, push locally saved changes to a mock API​ -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intersection observer example</title>
  </head>
  <body>
    <style>
      * {
        box-sizing: border-box;
      }
      .board {
        display: flex;
        width: 100%;
        gap: 5px;
      }
      .container {
        width: 30%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        border: solid black;
        padding: 5px;
      }
      .column {
        background: wheat;
        display: flex;
        flex-direction: column;
        width: 100%;
        min-height: 90vh;
        gap: 5px;
        padding: 4px;
      }
      .column h2 {
        text-align: center;
      }
      .column.dragon {
        background-color: rgb(122, 122, 123);
      }
      .column span {
        display: flex;
      }
      .column span button {
        margin-left: auto;
      }
      .create {
        margin-top: auto;
        align-self: flex-end;
      }
      .design{
        background-color: rgb(182, 72, 72);
      }
    </style>
  </body>
  <main>
    <div class="board">
      <div class="container">
        <div class="column todo">
          <h2>To do</h2>
        </div>
        <div class="create">
          <label for="task">Task:</label>
          <input type="text" id="task" />
          <button>Add</button>
        </div>
      </div>
      <div class="container">
        <div class="column progress">
          <h2>In progress</h2>
        </div>
        <div class="create">
          <label for="task">Task:</label>
          <input type="text" id="task" />
          <button>Add</button>
        </div>
      </div>
      <div class="container">
        <div class="column done">
          <h2>Done</h2>
        </div>
        <div class="create">
          <label for="task">Task:</label>
          <input type="text" id="task" />
          <button>Add</button>
        </div>
      </div>
    </div>
    <script src="kanban.js" type="module"></script>
  </main>
</html>
