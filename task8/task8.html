<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban To-fo List</title>
    <script src="task8.js" defer></script>
    <style>
      .progress-container {
        width: 100%;
        height: 20px;
        background-color: #e36a6a;
        border-radius: 10px;
        overflow: hidden;
        margin-bottom: 10px;
      }

      .progress-bar {
        width: 0%;
        height: 100%;
        background-color: #05fa0d;
        transition: transform 0.1s linear; /* Smooth visual easing */
      }
    </style>
  </head>
  <body>
    <div class="counter">
      <span id="element"></span>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <button id="uploadBtn">Start Upload</button>
  </body>
</html>
