<!doctype html>

    <title>Home Page</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width initial-scale=1.0" />
    <style>
      .container {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 10px;
        height: 2000px;
      }
      .overlay {
        display: none;
        position: fixed;
        z-index: 9999;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        backdrop-filter: blur(10px);
        justify-content: center;
        align-items: center;
      }
      .overlay-content {
        max-width: 70vw;
        max-height: 60vh;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        border-radius: 4px;
        object-fit: cover;
      }

      .close-btn {
        position: absolute;
        top: 20px;
        right: 30px;
        font-size: 40px;
        color: #6e0909;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
